models:
  - name: int_customers_agg
    description: "Aggregated customer metrics for each customer based on their order history"
    columns:
      - name: customer_id
        description: "Unique identifier for each customer"
        data_tests:
          - unique
          - not_null
      - name: total_orders
        description: "Total number of orders placed by the customer"
      - name: lifetime_value
        description: "Total monetary value of all orders placed by the customer"
      - name: average_order_value
        description: "Average monetary value of the customer's orders"
      - name: max_order_value
        description: "Maximum monetary value of a single order placed by the customer"
      - name: min_order_value
        description: "Minimum monetary value of a single order placed by the customer"
      - name: last_order_date
        description: "Date of the most recent order placed by the customer"
      - name: first_order_date
        description: "Date of the first order placed by the customer"
  - name: int_orders_enriched
    description: "Enriched order data with customer, store, and order context"
    columns:
      - name: order_id
        description: "Unique identifier for each order"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Unique identifier for each customer"
      - name: store_id
        description: "Unique identifier for each store"
      - name: customer_first_name
        description: "First name of the customer"
      - name: customer_last_name
        description: "Last name of the customer"
      - name: customer_city
        description: "City of the customer"
      - name: customer_province
        description: "Province of the customer"
      - name: customer_country
        description: "Country of the customer"
      - name: store_name
        description: "Name of the store"
      - name: store_city
        description: "City of the store"
      - name: store_province
        description: "Province of the store"
      - name: store_country
        description: "Country of the store"
      - name: order_timestamp
        description: "Timestamp when the order was placed"
      - name: order_date
        description: "Date when the order was placed"
      - name: order_year
        description: "Year when the order was placed"
      - name: order_month
        description: "Month when the order was placed"
      - name: order_day
        description: "Day when the order was placed"
      - name: order_hour
        description: "Hour when the order was placed"
      - name: is_completed
        description: "Flag indicating if the order is completed"
      - name: is_canceled
        description: "Flag indicating if the order is canceled"
      - name: is_pending
        description: "Flag indicating if the order is pending"
      - name: is_returned
        description: "Flag indicating if the order is returned"
      - name: order_gross_amount
        description: "Total monetary value of the order"
      - name: order_payment_method
        description: "Payment method used for the order"
